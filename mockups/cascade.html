<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zen cascade</title>
<link rel="stylesheet" href="zen.css" />
</head>
<body>
<div class="head">
  <h1>Cascade</h1>
  <p>Every line rebuilds the week past tomorrow, and the work shows. Moved blocks leave a dashed ghost and hop to their new day. The toast names the move and, when there is one, the habit behind it.</p>
  <nav><a href="capture.html">Capture</a><a href="card.html">Card</a><a href="first-week.html">First week</a><a href="pull.html">Today</a><a href="settings.html">Settings</a></nav>
</div>
<div class="gallery"></div>
<script src="zen.js"></script>
<script>
const DAYS = ["T6", "T7", "CN", "T2", "T3", "T4", "T5"];
const week = (days) => `<div class="week">${DAYS.map((d, i) => `<div class="day"><b class="${i === 0 ? "today" : ""}">${d}</b>${(days[i] || []).map(([k, h, m, n]) => `<div class="blk ${m || ""}" ${n ? `data-n="${n}"` : ""} style="--tone:${TONE[k]};--h:${h}px"></div>`).join("")}</div>`).join("")}</div>`;
const before = [[["study", 26], ["exercise", 20]], [["study", 22, "sit", 1]], [["social", 30]], [["study", 22, "sit", 2], ["other", 18]], [["study", 22, "sit", 3]], [["exercise", 20]], []];
const after = [[["study", 26], ["exercise", 20]], [["study", 22, "sit", 1], ["study", 22, "sit fly", 2]], [["social", 30]], [["study", 22, "ghost"], ["other", 18]], [["study", 22, "ghost"]], [["exercise", 20]], []];
const exam = [[["study", 26], ["exercise", 20]], [["study", 22, "sit", 1], ["exercise", 20, "fly"]], [["social", 30], ["study", 22, "sit fly", "ôn"]], [["study", 22, "sit", 2], ["exercise", 20, "ghost"]], [["study", 34, "fx"]], [["exercise", 20]], []];
mount([
  { tag: "Before", sub: "Three sittings ran to Tuesday. The due date is changed to Saturday on the task.", html: chrome(`<div class="title" style="margin-top:20px">Tuần này</div>${week(before)}`, { dock: "idle" }) },
  { tag: "After", sub: "Sittings 2 and 3 hop back to Saturday. Ghosts mark where they were.", html: toast("Bài luận xong trước thứ bảy", "2 buổi dời lên sớm") + chrome(`<div class="title" style="margin-top:46px">Tuần này</div>${week(after)}`, { dock: "idle" }) },
  { tag: "Campus change", sub: "An exam lands from DLU in the background. Gym steps aside, a prep sitting appears. No question asked.", dark: true, html: toast("Có lịch thi mới", "T3 17/11 · thêm buổi ôn, gym dời") + chrome(`<div class="title" style="margin-top:46px">Tuần này</div>${week(exam)}`, { time: "7:12" }) },
  { tag: "Notice, exam", sub: "Each campus change gets its own plain line, named by type. This one: a new exam.", html: toast("Thêm lịch thi: Giải tích 2", "T6 20/11 8:00", "Xem") + chrome(card({ kind: "study", title: "Ôn Giải tích", until: "Đến 15:00", p: "30%" }), { time: "7:12" }) },
  { tag: "Notice, room", sub: "A room change names the class and the new room.", html: toast("Đổi phòng: Cấu trúc dữ liệu", "Sang A2.301", "Xem") + chrome(card({ kind: "study", title: "Ôn Giải tích", until: "Đến 15:00", p: "30%" }), { time: "7:12" }) },
  { tag: "Notice, timetable", sub: "When a new semester goes live the whole timetable arrives at once.", html: toast("Thời khoá biểu học kỳ 1 đã có", "42 tiết, đã xếp vào tuần", "Xem") + chrome(card({ kind: "study", title: "Ôn Giải tích", until: "Đến 15:00", p: "30%" }), { time: "7:12" }) },
  { tag: "Notice, marks", sub: "Marks updated opens the Marks screen.", html: toast("Điểm vừa cập nhật", "Giải tích 2: 8,6", "Xem") + chrome(card({ kind: "study", title: "Ôn Giải tích", until: "Đến 15:00", p: "30%" }), { time: "7:12" }) },
  { tag: "Habit", sub: "The insight line uses a fixed template. It shows only when a habit moved something.", html: toast("Tập xong thì đọc nhé", "Đọc sách dời sang 18:30") + chrome(card({ kind: "exercise", title: "Gym", until: "Đến 18:15", p: "64%" }), { time: "17:41" }) },
]);
</script>
</body>
</html>
