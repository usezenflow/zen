<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zen settings</title>
<link rel="stylesheet" href="ui.css" />
</head>
<body>
<div class="head">
  <h1>Settings</h1>
  <p>One screen, Vietnamese only. Theme is pills. Campus connects inline (no sheets), keeps its passwords on the phone and syncs on its own. Marks open from campus. Disconnect sits quietly below and opens a dropdown.</p>
  <nav><a href="capture.html">Capture</a><a href="views.html">Views</a><a href="marks.html">Marks</a></nav>
</div>
<div class="gallery"></div>
<script src="ui.js"></script>
<script>
const close = `<span class="o">${ic(I.x, 20)}</span>`;
const pills = (xs, on) => `<div class="pills" style="margin-top:10px">${xs.map((x) => `<span class="pl sm ${x === on ? "on" : ""}">${x}</span>`).join("")}</div>`;
const set = (t, right, st = "") => `<div class="set" style="${st}">${t}${right}</div>`;
// Connect lives inline: the "Kết nối trường" row expands in place into the three fields.
const fld = (lab, val, err) => `<div class="field ${err ? "err" : ""}" style="margin-top:8px;height:60px;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;padding:0 22px"><span style="font-size:13px;font-weight:500;color:var(--muted)">${lab}</span><span style="${val ? "" : "color:var(--muted);font-weight:400"}">${val || "Nhập vào"}</span></div>${err ? `<div class="errt">${err}</div>` : ""}`;
const slowt = (t) => `<div class="errt" style="color:var(--muted);font-weight:500">${t}</div>`;
const form = (f = {}) => `${f.card ? "" : set("Kết nối trường", `<span class="v">${ic(I.down, 16)}</span>`, "border-bottom:none;padding-bottom:4px")}
  ${f.card ? "" : fld("Mã sinh viên", f.id)}${fld("Mật khẩu Online", f.portal, f.portalErr)}${f.portalSlow ? slowt("Online đang chậm, sẽ tự thử lại") : ""}${fld("Mật khẩu LMS", f.lms, f.lmsErr)}${f.lmsSlow ? slowt("LMS đang chậm, sẽ tự thử lại") : ""}
  <div class="btn sm" style="margin-top:18px">${f.portalSlow || f.lmsSlow || f.portalErr || f.lmsErr ? "Thử lại" : "Kết nối"}</div>`;
const card = (state, which, syn = "Cập nhật 07:12, tự đồng bộ") => `<div class="art" style="margin-top:12px;height:132px;padding:16px 18px">${art(state === "err" ? "exam" : "lecture", { w: 264, h: 132, seed: 5, cls: "bgart" })}
      <div class="lab" style="color:#fff;opacity:.85">Trường</div>
      <div style="font-size:${state === "err" ? 17 : 20}px;font-weight:600;margin-top:6px;padding-right:50px">${state === "err" ? `Mật khẩu ${which} đã đổi` : "2112345"}</div>
      <div class="small" style="padding-right:50px;font-size:14px;opacity:.9">${state === "err" ? "Chạm để nhập lại" : syn}</div>
      <span class="glass" style="position:absolute;right:14px;bottom:14px;width:44px;height:44px">${ic(state === "err" ? I.right : I.sync, 18)}</span></div>`;
const campus = (state, which) => state === "off" ? set("Kết nối trường", `<span class="v">${ic(I.right, 16)}</span>`)
  : state === "form" ? form(which)
  : state === "partial" ? card("on", "", which.sub) + form({ ...which, card: 1 }) + set("Ngắt kết nối", "", "border-bottom:none;color:var(--muted);font-weight:500;font-size:14px")
  : card(state, which) + (state === "on" ? set("Điểm", `<span class="v" style="color:var(--ink);font-weight:600">3,42</span><span class="o" style="width:30px;height:30px;margin-left:-6px">${ic(I.right, 14)}</span>`, "border-bottom:none") : "")
    + set("Ngắt kết nối", "", "border-bottom:none;color:var(--muted);font-weight:500;font-size:14px");
const main = (state, theme = "Hệ thống", which) => `${close}<div class="h" style="margin-top:18px">Cài đặt</div>
  <div class="lab" style="margin-top:28px">Giao diện</div>${pills(["Hệ thống", "Sáng", "Tối"], theme)}
  <div class="lab" style="margin-top:26px">Trường</div>${campus(state, which)}
  ${state === "form" || state === "partial" || state === "on" || state === "err" ? "" : set("Chia sẻ số liệu ẩn danh", '<span class="tog"></span>') + set("Báo lỗi", `<span class="v">${ic(I.right, 16)}</span>`)}`;
const FULL = { id: "2112345", portal: "••••••••", lms: "••••••" };
mount([
  { tag: "Not connected", sub: "Theme as pills (no language option: Vietnamese only); picking one sweeps the new theme in as a circle growing from the tap. Campus one row. Tap it and the fields open in place.", html: chrome(main("off"), { dock: null }) },
  { tag: "Connect", sub: "Inline, no sheet: the row expands into student ID, portal password and LMS password.", html: chrome(main("form"), { dock: null }) },
  { tag: "Wrong portal password", sub: "Says which one: the portal field turns red with its own message. LMS untouched.", html: chrome(main("form", "Hệ thống", { ...FULL, portalErr: "Sai mật khẩu Online" }), { dock: null }) },
  { tag: "Wrong LMS password", sub: "Same for the LMS field.", html: chrome(main("form", "Hệ thống", { ...FULL, lmsErr: "Sai mật khẩu LMS" }), { dock: null }) },
  { tag: "Portal slow, LMS connected", sub: "Each account is checked on its own: LMS connects, the portal shows its own neutral note and retries.", html: chrome(main("partial", "Hệ thống", { ...FULL, sub: "LMS đã kết nối", portalSlow: 1 }), { dock: null }) },
  { tag: "LMS slow, portal connected", sub: "Same the other way round: the portal connects, the LMS field carries the neutral note.", html: chrome(main("partial", "Hệ thống", { ...FULL, sub: "Online đã kết nối", lmsSlow: 1 }), { dock: null }) },
  { tag: "Connected", sub: "Campus becomes an art card with last sync; marks open below. The disconnect row has no divider above it.", html: chrome(main("on"), { dock: null }) },
  { tag: "Disconnect menu", sub: "Tap Ngắt kết nối: a dropdown with three choices, the last in red. No sheet, no confirm.", html: chrome(main("on") + menu([["Ngắt LMS"], ["Ngắt Online"], ["Ngắt cả hai", "", 1]], 334, 18), { dock: null }) },
  { tag: "Disconnected", sub: "Back to Not connected. A short note, no Undo; connecting again brings the timetable back.", html: chrome(toast("Đã ngắt kết nối", "Mật khẩu đã xoá khỏi máy", []) + main("off"), { dock: null }) },
  { tag: "Login changed, portal", sub: "The card turns exam red and names the account that changed. Tap to fix.", dark: true, html: chrome(main("err", "Tối", "Online"), { dock: null }) },
  { tag: "Login changed, LMS", sub: "Same card when only the LMS password changed.", dark: true, html: chrome(main("err", "Tối", "LMS"), { dock: null }) },
]);
</script>
</body>
</html>
