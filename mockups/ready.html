<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zen ready</title>
<link rel="stylesheet" href="ui.css" />
</head>
<body>
<div class="head">
  <h1>Getting ready</h1>
  <p>First launch downloads the ears and the mind once. Until both are on the phone the hold button wears a progress ring and does not listen, so nobody talks to a model that is not there. Campus and the calendar work meanwhile.</p>
  <nav><a href="views.html">Views</a><a href="logo.html">Logo</a></nav>
</div>
<div class="gallery"></div>
<script src="ui.js"></script>
<script>
const hero = (p, line) => `<div style="margin-top:6px"><div class="hello">Chào bạn</div><div class="h" style="margin-top:2px">Đang chuẩn bị</div></div>
  <div class="art" style="margin-top:20px;height:300px;padding:22px">${art("plan", { w: 264, h: 300, seed: 9, cls: "bgart" })}
    <div style="display:flex;justify-content:space-between;align-items:flex-start"><span class="lab" style="color:#fff;opacity:.85">Tải một lần</span>${LOGO(34, "white")}</div>
    <div style="position:absolute;left:22px;bottom:22px" class="meter"><span class="cap2" style="--p:${p * 100}%"><i></i></span><div><div class="big" style="font-size:44px">${Math.round(p * 100)}%</div><div class="small">${line}</div></div></div></div>
  <div style="margin-top:16px;font-size:13px;color:var(--muted);line-height:1.45">Chạy hoàn toàn trên máy, không cần mạng sau khi tải xong.</div>`;
const done = `<div style="margin-top:6px"><div class="hello">Sẵn sàng</div><div class="h" style="margin-top:2px">Giữ nút và kể tuần của bạn</div></div>
  <div style="margin-top:22px;font-size:15px;line-height:1.5;color:var(--muted)">“Thứ sáu làm bài tập giải tích, tập gym ba buổi, thứ ba nộp tiểu luận.”</div>`;
mount([
  { tag: "Downloading", sub: "One number, one ring. The button is grey and does not listen.", html: chrome(hero(0.42, "1,1 trên 2,6 GB"), { dock: "off", p: 0.42 }) },
  { tag: "Almost", sub: "The ring fills from ink to vermilion.", dark: true, html: chrome(hero(0.91, "Còn khoảng 1 phút"), { dock: "off", p: 0.91 }) },
  { tag: "Ready", sub: "The button turns ink. One example line, nothing else.", html: chrome(done) },
]);
</script>
</body>
</html>
