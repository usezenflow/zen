<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zen today</title>
<link rel="stylesheet" href="zen.css" />
</head>
<body>
<div class="head">
  <h1>Today</h1>
  <p>Swipe up from the card for today and your notes. Big pills, nothing to edit. Campus items wear a ring. Done ones fade and strike through. To change anything, hold and say it.</p>
  <nav><a href="card.html">Card</a><a href="first-week.html">First week</a><a href="cascade.html">Cascade</a><a href="settings.html">Settings</a></nav>
</div>
<div class="gallery"></div>
<script src="zen.js"></script>
<script>
const P = (k, t, at, cls = "", from = "") => `<div class="pill ${cls}" style="--tone:${TONE[k]}"><div class="dot"></div><b>${t}</b><span>${at}</span>${from ? `<i class="from">${from}</i>` : ""}</div>`;
const N = (t, at) => `<div class="pill" style="--tone:var(--chores)"><div class="dot" style="display:grid;place-items:center;color:#fff">${ic(I.note, 18)}</div><b style="font-size:14.5px;font-weight:600">${t}</b><span>${at}</span></div>`;
const today = `<div class="title" style="margin-top:10px">Hôm nay</div>
  <div class="sec">Thứ sáu 13</div><div class="stack">
  ${P("study", "Lý thuyết đồ thị", "07:00", "fixed done")}
  ${P("study", "Bài tập giải tích", "14:00", "new")}
  ${P("exercise", "Gym", "17:30")}
  ${P("other", "Đọc sách", "20:00")}</div>
  <div class="sec">Ghi chú</div><div class="stack">
  ${N("Hỏi thầy về đề tài", "09:12")}
  ${N("Mua pin cho chuột", "hôm qua")}</div>`;
mount([
  { tag: "Today", sub: "The card's task glows. The lecture from DLU has a ring and is done.", html: chrome(today, { dock: null, grab: false, gear: false }) },
  { tag: "Dark", sub: "Same in dark.", dark: true, html: chrome(today, { dock: null, grab: false, gear: false, time: "21:30" }) },
  { tag: "Nothing yet", sub: "An empty day keeps the stones.", html: chrome(`<div class="title" style="margin-top:10px">Hôm nay</div><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">${STONES}<div style="font-size:20px;font-weight:800">Ngày trống, thở chút</div></div>`, { dock: null, grab: false, gear: false }) },
]);
</script>
</body>
</html>
