<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zen card</title>
<link rel="stylesheet" href="zen.css" />
</head>
<body>
<div class="head">
  <h1>The card</h1>
  <p>The whole app is one card and one button. The card shows the one thing to do now. Hold the button and speak. Swipe the card right when done, left for later. Swipe up for today.</p>
  <nav><a href="capture.html">Capture</a><a href="first-week.html">First week</a><a href="cascade.html">Cascade</a><a href="pull.html">Today</a><a href="settings.html">Settings</a></nav>
</div>
<div class="gallery"></div>
<script src="zen.js"></script>
<script>
mount([
  { tag: "Now", sub: "One task, until when. The bar fills continuously as time passes, not in steps.", html: chrome(card({ kind: "study", title: "Bài tập giải tích, phần 2", until: "Đến 15:30", p: "38%" })) },
  { tag: "Listening", sub: "Live words appear as you speak. The last word is partial and slightly faded until it settles. The button swells and glows.", html: chrome(`<div class="words">dời bài luận sang thứ sáu, và nhắc mình<em> đi</em></div><div class="wave">${[10, 18, 26, 14, 22, 8, 20, 12, 24, 16, 9, 19].map((h) => `<i style="height:${h}px"></i>`).join("")}</div>`, { dock: "live" }) },
  { tag: "Thinking", sub: "The mark replaces the mic while the week is rebuilt, under a second or two.", html: chrome(`<div class="words">dời bài luận sang thứ sáu, và nhắc mình đi gym</div>`, { dock: "think" }) },
  { tag: "Free gap", sub: "A gap opens and Zenflow offers a task that fits it. Swipe right to take it.", html: chrome(card({ kind: "chores", title: "40p trống, dọn phòng vừa đủ", until: "Đến 15:00", p: "0%" })) },
  { tag: "Empty, first launch", sub: "No onboarding. The leaf and one line of copy.", dark: true, html: chrome(`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-bottom:170px">${STONES}<div style="font-size:24px;font-weight:800;text-align:center;letter-spacing:-.02em;line-height:1.2">Giữ nút và kể<br>tuần này của bạn</div></div>`, { time: "21:04", grab: false }) },
  { tag: "Night, nothing left", sub: "Done for today. The next thing shows dimmed.", dark: true, html: chrome(`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-bottom:170px">${STONES}<div style="font-size:24px;font-weight:800;text-align:center;letter-spacing:-.02em">Hôm nay xong rồi</div><div style="font-size:15px;font-weight:600;color:var(--muted)">Mai 8:00, đọc chương 4</div></div>`, { time: "22:41" }) },
]);
</script>
</body>
</html>
