<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zen marks</title>
<link rel="stylesheet" href="ui.css" />
<style>@keyframes z{to{transform:rotate(360deg)}}

/* Empty state, as in views.html: the card takes the art card's slot. */
.rest { position: relative; margin-top: 18px; height: 150px; border-radius: 28px; background: var(--chip); padding: 20px; display: flex; flex-direction: column; }
.rest .lf { position: absolute; top: 18px; right: 18px; color: var(--ink); }
.rest .t { margin-top: auto; padding-right: 58px; font-size: 24px; line-height: 1.15; font-weight: 600; letter-spacing: -.02em; }
.rest .s { margin-top: 6px; font-size: 15px; color: var(--muted); font-weight: 500; line-height: 1.35; }
</style>
</head>
<body>
<div class="head">
  <h1>Marks</h1>
  <p>Read only, from the campus portal. GPA in an art card, then each term as a plain list. Weak courses quietly get one more short review before their exam. The circle at the top right asks for marks again, as one job in the queue, like the circle on the Settings row.</p>
  <nav><a href="capture.html">Capture</a><a href="settings.html">Settings</a><a href="fees.html">Fees</a><a href="views.html">Views</a></nav>
</div>
<div class="gallery"></div>
<script src="ui.js"></script>
<script>
const row = (c, cr, s, l) => `<div class="r"><div class="tx"><b>${c}</b><small>${cr} tín chỉ</small></div><span class="tm" style="color:var(--ink);font-size:17px">${s}</span><span class="pl sm" style="width:44px;padding:0">${l}</span></div>`;
const page = (dark, run) => `<div style="display:flex;justify-content:space-between"><span class="o">${ic(I.back, 20)}</span><span class="o">${run ? `<span style="display:flex;animation:z 1s linear infinite">${ic(I.sync, 20)}</span>` : ic(I.sync, 20)}</span></div><div class="h" style="margin-top:18px">Điểm</div><div class="sub" style="margin-top:4px">${run ? "Đang cập nhật…" : "Cập nhật hôm qua"}</div>
  <div class="art" style="margin-top:18px;height:150px;padding:18px 20px">${art("assignment", { w: 264, h: 150, seed: 2, cls: "bgart" })}
    <div class="lab" style="color:#fff;opacity:.85">Tích luỹ</div>
    <div style="position:absolute;left:20px;bottom:18px" class="meter"><span class="cap2" style="--p:85%"><i></i></span><div><div class="big" style="font-size:40px">3,42</div><div class="small">98 tín chỉ, hệ 4</div></div></div></div>
  <div class="lab" style="margin-top:28px">Học kỳ 1, 2026 <span>3,58</span></div>
  <div class="list" style="margin-top:6px">${row("Giải tích 2", 3, "8,6", "A")}${row("Cơ sở dữ liệu", 3, "7,9", "B+")}${row("Xác suất thống kê", 3, "5,4", "D+")}</div>`;
const empty = `<span class="o">${ic(I.back, 20)}</span><div class="h" style="margin-top:18px">Điểm</div>
  <div class="rest"><span class="lab">Tích luỹ</span><span class="lf">${LOGO(52, "line")}</span><div class="t">Chưa có điểm</div><div class="s">Kết nối Online trong Cài đặt, điểm sẽ về đây.</div></div>`;
mount([
  { tag: "Marks", sub: "One number up top, plain rows below. Letter in a hairline pill.", html: chrome(page(false), { dock: null }) },
  { tag: "Marks, updating", sub: "Tap the circle: it turns while the job runs, then the line shows the time again. Tapping it again meanwhile adds nothing.", html: chrome(page(false, true), { dock: null }) },
  { tag: "Marks, empty", sub: "Same slot as the GPA card, same quiet card as the empty views, leaf in outline. It says where marks come from.", html: chrome(empty, { dock: null }) },
  { tag: "Marks, dark", sub: "Same in dark.", dark: true, html: chrome(page(true), { dock: null }) },
]);
</script>
</body>
</html>
