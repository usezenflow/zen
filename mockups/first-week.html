<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zen first week</title>
<link rel="stylesheet" href="zen.css" />
</head>
<body>
<div class="head">
  <h1>First week</h1>
  <p>The first launch has no setup. One breath fills the week. The blocks fly in day by day, the essay fans into sittings, and the card settles on what to do now.</p>
  <nav><a href="capture.html">Capture</a><a href="card.html">Card</a><a href="cascade.html">Cascade</a><a href="pull.html">Today</a><a href="settings.html">Settings</a></nav>
</div>
<div class="gallery"></div>
<script src="zen.js"></script>
<script>
const DAYS = ["T6", "T7", "CN", "T2", "T3", "T4", "T5"];
// Each day: list of [kind, height, mod] blocks.
const full = [
  [["study", 26], ["exercise", 20]],
  [["study", 22, "sit", 1], ["other", 18]],
  [["social", 30], ["other", 18]],
  [["study", 22, "sit", 2], ["exercise", 20], ["other", 18]],
  [["study", 22, "sit", 3], ["other", 18]],
  [["exercise", 20], ["other", 18]],
  [["other", 18]],
];
const week = (days, opt = {}) => `<div class="week">${DAYS.map((d, i) => `<div class="day"><b class="${i === 0 ? "today" : ""}">${d}</b>${(days[i] || []).map(([k, h, m, n]) => `<div class="blk ${m || ""} ${opt.fly && i >= opt.fly ? "fly" : ""}" ${n ? `data-n="${n}"` : ""} style="--tone:${TONE[k]};--h:${h}px${opt.fly && i > opt.fly ? ";opacity:.35" : ""}"></div>`).join("")}</div>`).join("")}</div>`;
const legend = `<div class="stack" style="margin-top:26px;position:relative;z-index:5">
  <div class="pill" style="--tone:var(--study)"><div class="dot"></div><b>Bài luận</b><span>3 buổi</span></div>
  <div class="pill" style="--tone:var(--exercise)"><div class="dot"></div><b>Gym</b><span>3 lần</span></div>
  <div class="pill" style="--tone:var(--other)"><div class="dot"></div><b>Đọc sách</b><span>mỗi tối</span></div></div>`;
const said = "bài tập giải tích nộp thứ sáu, gym ba buổi, bài luận hạn thứ ba tuần sau, tối nào cũng đọc sách, chủ nhật đi cà phê với Lan";
mount([
  { tag: "Empty", sub: "No account, no setup. Just the button.", dark: true, html: chrome(`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-bottom:170px">${STONES}<div style="font-size:24px;font-weight:800;text-align:center;letter-spacing:-.02em;line-height:1.2">Giữ nút và kể<br>tuần này của bạn</div></div>`, { time: "21:04", grab: false }) },
  { tag: "One breath", sub: "The whole week, said once.", dark: true, html: chrome(`<div class="words" style="font-size:21px">${said.slice(0, 92)}<em>${said.slice(92)}</em></div><div class="wave">${[10, 18, 26, 14, 22, 8, 20, 12, 24, 16, 9, 19].map((h) => `<i style="height:${h}px"></i>`).join("")}</div>`, { time: "21:04", dock: "live", grab: false }) },
  { tag: "Filling", sub: "Blocks drop in day by day. The essay splits into sittings that lean early.", dark: true, html: chrome(`<div class="title" style="margin-top:20px">Tuần của bạn</div>${week(full.map((d, i) => (i < 4 ? d : [])), { fly: 3 })}`, { time: "21:05", dock: "think", grab: false }) },
  { tag: "Placed", sub: "One line says what happened. Undo takes it all back.", dark: true, html: toast("Xếp xong 11 việc", "Bài luận chia 3 buổi") + chrome(`<div class="title" style="margin-top:46px">Tuần của bạn</div>${week(full)}`, { time: "21:05", grab: true }) },
  { tag: "Next morning", sub: "The card shows the first sitting. The phone calendar has the rest.", html: chrome(card({ kind: "study", title: "Bài tập giải tích", until: "Đến 10:00", p: "12%" }), { time: "8:46" }) },
]);
</script>
</body>
</html>
