name: Mobile

# Native builds, ported from zenflow's mobile.yml and release-beta.yml: a signed
# Android APK and an unsigned iOS .ipa (for SideStore/AltStore sideloading).
#   1. Merging changesets to main opens/updates a "version packages" PR.
#   2. Merging that PR bumps package.json and writes CHANGELOG.md, so the next run
#      sees a version with no tag yet, builds both apps and publishes release
#      vX.Y.Z with them attached. The app updates itself from that release.
# Run it by hand to build both apps without releasing.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version-pr:
    name: Version packages PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  detect:
    name: Is there an untagged version?
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.v.outputs.new }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  # Cheap gate: no point spending native-build minutes on a red tree.
  test:
    name: Typecheck + tests
    needs: detect
    if: needs.detect.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The native build fills the runner disk otherwise. The Android SDK/NDK
      # under /usr/local/lib/android is what Gradle needs, so it stays.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null || true
          df -h /
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # CMake picks the launcher up from these env vars, so React Native's C++
      # is compiled once per source change.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: android-
          max-size: 1G
      - name: Use ccache for CMake
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Prebuild (android/ is gitignored)
        run: pnpm exec expo prebuild --platform android --no-install --clean
      # Metro's transform cache: the JS bundle only retransforms changed files.
      - uses: actions/cache@v4
        with:
          path: /tmp/metro-cache
          key: metro-android-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: metro-android-${{ hashFiles('pnpm-lock.yaml') }}-
      # plugins/with-release-signing.js signs with this key so installs update in
      # place. Without the secret the APK falls back to the debug key.
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with the debug key and cannot update existing installs"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      # arm64-v8a only (phones); lintVitalRelease only lints, skipping it saves minutes and heap.
      - name: Assemble release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # services.gradle.org flakes with 504s; retry the wrapper download.
          for i in 1 2 3 4 5; do ./gradlew --version && break || { [ "$i" = 5 ] && exit 1; sleep $((i * 15)); }; done
          args=(-PreactNativeArchitectures=arm64-v8a -x lintVitalRelease --continue
            -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC"
            -Pkotlin.daemon.jvm.options="-Xmx1g")
          # Dex first: classpath and duplicate class errors fail in minutes, before the C++ build.
          ./gradlew :app:mergeDexRelease "${args[@]}"
          ./gradlew assembleRelease "${args[@]}"
      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/zen-android.apk
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --verbose --print-certs dist/zen-android.apk | grep -E "Signer #1 certificate (DN|SHA-256)" || true
      - uses: actions/upload-artifact@v7
        with:
          name: zen-android-apk
          path: dist/zen-android.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS app (unsigned)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      # Same iOS inputs as an earlier run: reuse its .ipa instead of rebuilding.
      - id: ipa
        uses: actions/cache/restore@v4
        with:
          path: dist/zen-ios-unsigned.ipa
          key: ipa-${{ hashFiles('src/**', 'assets/**', 'plugins/**', 'patches/**', 'app.json', 'pnpm-lock.yaml') }}
      - uses: pnpm/action-setup@v4
        if: steps.ipa.outputs.cache-hit != 'true'
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        if: steps.ipa.outputs.cache-hit != 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.ipa.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.ipa.outputs.cache-hit != 'true'
        with:
          xcode-version: latest-stable
      - name: Prebuild (ios/ is gitignored)
        if: steps.ipa.outputs.cache-hit != 'true'
        run: pnpm exec expo prebuild --platform ios --clean --no-install
      - uses: actions/cache@v4
        if: steps.ipa.outputs.cache-hit != 'true'
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # One derived-data entry per lockfile: a per-commit key fills the repo cache.
      - uses: actions/cache@v4
        if: steps.ipa.outputs.cache-hit != 'true'
        with:
          path: ios/build-device
          key: ios-derived-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ios-derived-${{ runner.os }}-
      # prebuild exits 0 even when its own pod install fails, so install here
      # where a failure is visible, and retry runner I/O blips.
      - name: Install pods
        if: steps.ipa.outputs.cache-hit != 'true'
        working-directory: ios
        run: |
          for attempt in 1 2 3; do
            pod install && exit 0
            echo "::warning::pod install failed (attempt $attempt)"
            sleep 15
          done
          exit 1
      # Unsigned device build: SideStore/AltStore re-sign it on the phone with a
      # free Apple ID, so CI needs no certificate. Paid entitlements (push,
      # app groups for widgets) do not survive free signing.
      - name: Build for a device (unsigned)
        if: steps.ipa.outputs.cache-hit != 'true'
        working-directory: ios
        run: |
          xcodebuild \
            -workspace Zen.xcworkspace -scheme Zen \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package the unsigned .ipa
        if: steps.ipa.outputs.cache-hit != 'true'
        run: |
          rm -rf Payload
          mkdir -p Payload dist
          cp -R ios/build-device/Build/Products/Release-iphoneos/Zen.app Payload/
          zip -qry dist/zen-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: zen-ios-unsigned-ipa
          path: dist/zen-ios-unsigned.ipa
          if-no-files-found: error
      - if: steps.ipa.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/zen-ios-unsigned.ipa
          key: ${{ steps.ipa.outputs.cache-primary-key }}

  release:
    name: Publish GitHub release
    needs: [detect, build-android, build-ios]
    if: needs.detect.outputs.new == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          # GITHUB_TOKEN cannot tag a commit that changes .github/workflows; RELEASE_TOKEN needs Contents and Workflows write.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          # CHANGELOG.md's section (written by changesets); the app shows its "- " lines as what's new.
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Zen $VERSION" > notes.md
          gh release create "v$VERSION" dist/zen-android.apk dist/zen-ios-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md --latest
